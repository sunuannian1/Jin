<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>经典 iOS 相册风原型</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family: -apple-system, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
    background:#0f1115;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; gap:32px; padding:24px;
  }
  .phone {
    width:390px; height:844px; background:#000; border-radius:54px;
    box-shadow:0 30px 80px rgba(0,0,0,.6), 0 0 0 12px #1c1c1e, 0 0 0 13px #3a3a3c;
    position:relative; overflow:hidden; flex-shrink:0;
  }
  .screen { position:absolute; inset:0; border-radius:54px; overflow:hidden; background:#f2f2f7; }
  .scroller {
    position:absolute; inset:0; overflow-y:auto; overscroll-behavior:none;
    -webkit-overflow-scrolling:touch;
  }
  .scroller::-webkit-scrollbar{ display:none; }

  /* 状态栏（浅色） */
  .statusbar {
    position:absolute; top:0; left:0; right:0; height:54px; z-index:30;
    display:flex; justify-content:space-between; align-items:center;
    padding:18px 28px 0; color:#111; font-size:15px; font-weight:600; pointer-events:none;
  }
  /* 导航栏 */
  .navbar {
    position:absolute; top:54px; left:0; right:0; height:44px; z-index:29;
    display:flex; align-items:center; justify-content:center;
    color:#111; transition: background .25s;
  }
  .navbar .back { position:absolute; left:8px; top:0; height:44px; width:48px; display:flex; align-items:center; font-size:22px; color:#007aff; }
  .navbar .right { position:absolute; right:16px; top:0; height:44px; display:flex; align-items:center; font-size:16px; color:#007aff; }
  .navbar .nav-title { font-size:17px; font-weight:600; opacity:0; transition:opacity .25s; }
  .navbar.blurred { background: rgba(249,249,249,.86); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-bottom:.5px solid rgba(0,0,0,.1); }

  /* Large Title 区 */
  .lt-block { padding: 6px 20px 14px; }
  .lt { font-size:32px; font-weight:800; color:#000; letter-spacing:-.4px; will-change:transform,opacity; }
  .lt-sub { font-size:14px; font-weight:500; color:#8e8e93; margin-top:2px; }

  /* 封面图：滚动流第一行，下拉拉伸，不压字 */
  .cover {
    margin: 0 16px; height:200px; border-radius:16px; overflow:hidden; position:relative;
    background:#ddd; box-shadow:0 2px 10px rgba(0,0,0,.08);
  }
  .cover .bg {
    position:absolute; inset:0; will-change:transform;
    background:
      radial-gradient(120% 80% at 30% 20%, rgba(255,255,255,.25), transparent 60%),
      linear-gradient(160deg,#1e3a5f 0%,#2d6a9f 45%,#d98345 100%);
  }

  /* 日期分组 */
  .datehdr { display:flex; align-items:baseline; justify-content:space-between; padding:18px 20px 8px; }
  .datehdr .d { font-size:17px; font-weight:700; color:#000; }
  .datehdr .n { font-size:13px; font-weight:500; color:#8e8e93; }

  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:3px; padding:0 0 120px; }
  .cell { aspect-ratio:1/1; overflow:hidden; background:#e5e5ea; }
  .cell .g { position:absolute; inset:0; }

  .notes { width:300px; color:#e8e8ec; }
  .notes h2 { font-size:20px; margin-bottom:14px; font-weight:700; }
  .notes ul { list-style:none; }
  .notes li { font-size:14px; line-height:1.7; margin-bottom:10px; padding-left:18px; position:relative; color:#c7c7cc; }
  .notes li::before { content:""; position:absolute; left:0; top:9px; width:7px; height:7px; border-radius:50%; background:#007aff; }
  .notes b { color:#fff; }
  @media (max-width:900px){ .notes{ display:none; } }
</style>
</head>
<body>
  <div class="phone">
    <div class="screen">
      <div class="scroller" id="scroller">
        <!-- Large Title -->
        <div class="lt-block" id="ltBlock">
          <div class="lt" id="ltTitle">秋季运动会</div>
          <div class="lt-sub">28 张照片</div>
        </div>
        <!-- 封面：滚动流第一行 -->
        <div class="cover" id="cover"><div class="bg" id="coverBg"></div></div>

        <div class="datehdr">
          <span class="d">2025年9月16日 星期二</span>
          <span class="n">12 张</span>
        </div>
        <div class="grid" id="grid"></div>
      </div>

      <div class="statusbar"><span>9:41</span><span style="font-size:12px;">▂▄▆ ▮</span></div>
      <div class="navbar" id="navbar">
        <span class="back">‹</span>
        <span class="nav-title" id="navTitle">秋季运动会</span>
        <span class="right">选择</span>
      </div>
    </div>
  </div>

  <div class="notes">
    <h2>经典 iOS 相册风（浅色）</h2>
    <ul>
      <li><b>Large Title</b>：左上角 32pt 粗体大标题，上滑时收缩进导航栏，最接近系统相册。</li>
      <li><b>封面图不压字</b>：圆角卡片独立成块，干净照片，文字都在下方白色区。</li>
      <li><b>下拉</b>：到顶后封面跟手拉伸、松手回弹；标题随上滑自然收进导航栏。</li>
      <li><b>配色</b>：iOS 分组灰底 #f2f2f7、强调蓝 #007aff，无压黑字。</li>
    </ul>
  </div>

<script>
  const grid = document.getElementById('grid');
  const hues = [200,150,30,350,270,180,40,210,10,130,300,50,160,25,340,190,80,260];
  for (let i=0;i<18;i++){
    const c = document.createElement('div');
    c.className='cell';
    const h = hues[i % hues.length];
    c.innerHTML = `<div class="g" style="position:absolute;inset:0;background:
      radial-gradient(120% 100% at ${20+Math.random()*60}% ${20+Math.random()*60}%,
        hsl(${h} 65% 62% / .95), hsl(${(h+40)%360} 60% 38% / .95));"></div>`;
    grid.appendChild(c);
  }

  const scroller = document.getElementById('scroller');
  const cover = document.getElementById('cover');
  const coverBg = document.getElementById('coverBg');
  const ltBlock = document.getElementById('ltBlock');
  const ltTitle = document.getElementById('ltTitle');
  const navbar = document.getElementById('navbar');
  const navTitle = document.getElementById('navTitle');
  const BASE_H = 200;

  function onScroll(){
    const t = Math.max(0, scroller.scrollTop);
    const prog = Math.min(t / 100, 1);
    // Large Title 上移+缩小+淡出
    ltTitle.style.transform = `translateY(${prog*30}px) scale(${1 - prog*0.35})`;
    ltTitle.style.opacity = String(1 - prog);
    ltBlock.style.opacity = String(1 - prog*0.6);
    navTitle.style.opacity = String(prog);
    navbar.classList.toggle('blurred', t > 10);
  }
  scroller.addEventListener('scroll', onScroll, {passive:true});

  // 下拉拉伸封面
  let dragging=false, startY=0, startScroll=0, pull=0;
  function applyPull(){
    cover.style.height = (BASE_H + pull) + 'px';
    const s = 1 + pull/1000;
    coverBg.style.transform = `scale(${s}) translateY(${pull*0.18}px)`;
  }
  scroller.addEventListener('pointerdown', e=>{ dragging=true; startY=e.clientY; startScroll=scroller.scrollTop; });
  scroller.addEventListener('pointermove', e=>{
    if(!dragging) return;
    const dy = e.clientY - startY;
    if(startScroll<=0 && dy>0){ pull = Math.min(dy, 160); applyPull(); }
    else if(pull>0){ pull = Math.max(0, pull + dy*0.5); applyPull(); }
  });
  function endDrag(){
    if(!dragging) return; dragging=false;
    if(pull>0){
      cover.style.transition='height .45s cubic-bezier(.22,1,.36,1)';
      coverBg.style.transition='transform .45s cubic-bezier(.22,1,.36,1)';
      pull=0; applyPull();
      setTimeout(()=>{ cover.style.transition=''; coverBg.style.transition=''; },460);
    }
  }
  scroller.addEventListener('pointerup', endDrag);
  scroller.addEventListener('pointercancel', endDrag);
  scroller.addEventListener('pointerleave', endDrag);
  scroller.addEventListener('wheel', e=>{
    if(scroller.scrollTop<=0 && e.deltaY>0 && pull<140){
      pull = Math.min(pull + e.deltaY*0.6, 140); applyPull();
      clearTimeout(window._rb);
      window._rb = setTimeout(()=>{
        cover.style.transition='height .45s cubic-bezier(.22,1,.36,1)';
        coverBg.style.transition='transform .45s cubic-bezier(.22,1,.36,1)';
        pull=0; applyPull();
        setTimeout(()=>{cover.style.transition='';coverBg.style.transition='';},460);
      },120);
    }
  }, {passive:true});
</script>
</body>
</html>
