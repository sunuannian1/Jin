name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [master, main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build app (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project ClassTeacherApp.xcodeproj \
            -scheme ClassTeacherApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build 2>&1 | tee build.log

      - name: Compile Assets
        run: |
          xcrun actool --compile build/Build/Products/Release-iphoneos/ClassTeacherApp.app \
            --platform iphoneos \
            --minimum-deployment-target 16.0 \
            --app-icon AppIcon \
            --output-partial-info-plist /tmp/asset-info.plist \
            Assets.xcassets 2>&1 || echo "actool warning, continuing"
          ls -la build/Build/Products/Release-iphoneos/ClassTeacherApp.app/Assets.car 2>/dev/null || echo "No Assets.car generated"
          # Merge icon info into Info.plist
          if [ -f /tmp/asset-info.plist ]; then
            echo "=== asset-info.plist ==="
            cat /tmp/asset-info.plist
            plutil -merge /tmp/asset-info.plist build/Build/Products/Release-iphoneos/ClassTeacherApp.app/Info.plist
            echo "Merged icon info into Info.plist"
          fi

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/ClassTeacherApp.app" Payload/
          zip -r ClassTeacherApp-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClassTeacherApp-unsigned-ipa
          path: ClassTeacherApp-unsigned.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
