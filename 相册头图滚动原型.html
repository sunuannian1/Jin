<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>相册封面跟随滚动原型</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family: -apple-system, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
    background:#0f1115;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; gap:32px; padding:24px;
  }
  .phone {
    width:390px; height:844px; background:#000; border-radius:54px;
    box-shadow:0 30px 80px rgba(0,0,0,.6), 0 0 0 12px #1c1c1e, 0 0 0 13px #3a3a3c;
    position:relative; overflow:hidden; flex-shrink:0;
  }
  /* 屏幕内可滚动区 */
  .screen {
    position:absolute; inset:0; border-radius:54px; overflow:hidden; background:#000;
  }
  .scroller {
    position:absolute; inset:0; overflow-y:auto; overscroll-behavior:none;
    -webkit-overflow-scrolling:touch;
    background: #0b0b0d;
  }
  .scroller::-webkit-scrollbar{ display:none; }

  /* 状态栏 */
  .statusbar {
    position:absolute; top:0; left:0; right:0; height:54px; z-index:30;
    display:flex; justify-content:space-between; align-items:center;
    padding:18px 28px 0; color:#fff; font-size:15px; font-weight:600;
    pointer-events:none;
  }
  /* 导航栏（固定） */
  .navbar {
    position:absolute; top:54px; left:0; right:0; height:44px; z-index:29;
    display:flex; align-items:center; justify-content:center;
    background: rgba(11,11,13,0);
    transition: background .25s;
  }
  .navbar .back {
    position:absolute; left:8px; top:0; height:44px; width:48px;
    display:flex; align-items:center; color:#fff; font-size:22px; font-weight:500;
  }
  .navbar .nav-title {
    font-size:17px; font-weight:600; color:#fff; opacity:0; transition:opacity .25s;
  }
  .navbar.blurred { background: rgba(20,20,24,.82); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom:.5px solid rgba(255,255,255,.12); }

  /* ===== 头图：滚动流第一行，下拉拉伸 ===== */
  .hero {
    position:relative; width:100%; height:240px; overflow:hidden;
    background: linear-gradient(160deg,#1e3a5f 0%,#2d6a9f 45%,#c2643a 100%);
  }
  .hero .bg {
    position:absolute; inset:0;
    background:
      radial-gradient(120% 80% at 30% 20%, rgba(255,255,255,.25), transparent 60%),
      linear-gradient(160deg,#1e3a5f 0%,#2d6a9f 45%,#d98345 100%);
    will-change: transform;
  }
  .hero .scrim {
    position:absolute; left:0; right:0; bottom:0; height:65%;
    background: linear-gradient(to top, rgba(0,0,0,.72), rgba(0,0,0,0));
  }
  .hero .title {
    position:absolute; left:20px; bottom:18px; right:20px;
    will-change: transform, opacity;
  }
  .hero .title h1 {
    color:#fff; font-size:28px; font-weight:800; letter-spacing:.2px; line-height:1.1;
  }
  .hero .title p { color:rgba(255,255,255,.85); font-size:13px; font-weight:500; margin-top:4px; }

  /* 日期分组 */
  .datehdr {
    display:flex; align-items:baseline; justify-content:space-between;
    padding:14px 18px 8px;
    color:#f2f2f5;
  }
  .datehdr .d { font-size:16px; font-weight:700; }
  .datehdr .n { font-size:13px; font-weight:500; color:#8e8e93; }

  /* 照片网格 3 列 */
  .grid {
    display:grid; grid-template-columns:repeat(3,1fr); gap:3px;
    padding:0 0 120px;
  }
  .cell {
    aspect-ratio:1/1; overflow:hidden; background:#1c1c1f; position:relative;
  }
  .cell img { width:100%; height:100%; object-fit:cover; display:block; }
  .cell .g {
    position:absolute; inset:0;
  }

  /* 右侧说明面板 */
  .notes { width:300px; color:#e8e8ec; }
  .notes h2 { font-size:20px; margin-bottom:14px; font-weight:700; }
  .notes ul { list-style:none; }
  .notes li { font-size:14px; line-height:1.7; margin-bottom:10px; padding-left:18px; position:relative; color:#c7c7cc; }
  .notes li::before { content:""; position:absolute; left:0; top:9px; width:7px; height:7px; border-radius:50%; background:#34c759; }
  .notes b { color:#fff; }
  @media (max-width:900px){ .notes{ display:none; } }
</style>
</head>
<body>
  <div class="phone">
    <div class="screen">
      <div class="scroller" id="scroller">
        <!-- 头图（滚动流第一行） -->
        <div class="hero" id="hero">
          <div class="bg" id="heroBg"></div>
          <div class="scrim"></div>
          <div class="title" id="heroTitle">
            <h1>秋季运动会</h1>
            <p>28 张照片</p>
          </div>
        </div>

        <div class="datehdr">
          <span class="d">2025年9月16日 星期二</span>
          <span class="n">12 张</span>
        </div>
        <div class="grid" id="grid"></div>
      </div>

      <!-- 状态栏 -->
      <div class="statusbar">
        <span>9:41</span>
        <span style="display:flex;gap:6px;align-items:center;">
          <span style="font-size:12px;">●●●●</span><span style="font-size:12px;">▂▄▆</span><span style="font-size:12px;">▮</span>
        </span>
      </div>
      <!-- 导航栏 -->
      <div class="navbar" id="navbar">
        <span class="back">‹</span>
        <span class="nav-title" id="navTitle">秋季运动会</span>
      </div>
    </div>
  </div>

  <div class="notes">
    <h2>头图跟随滚动（iOS 相册 / 回忆风）</h2>
    <ul>
      <li><b>上滑</b>：封面就是滚动内容第一行，自然跟着内容走，<b>不会断开</b>；大字标题同步收缩成导航栏小字。</li>
      <li><b>下拉</b>：到顶后继续往下拽，封面<b>跟手拉伸</b>，松手回弹，图片内容轻微放大。</li>
      <li><b>导航栏</b>：滚动后出现毛玻璃底，标题居中显示。</li>
      <li>网格 3 列贴边、严格正方形，与你已验收的样式一致。</li>
    </ul>
  </div>

<script>
  // 生成照片占位（渐变 + 随机色相，模拟照片）
  const grid = document.getElementById('grid');
  const hues = [200,150,30,350,270,180,40,210,10,130,300,50,160,25,340,190,80,260];
  for (let i=0;i<18;i++){
    const c = document.createElement('div');
    c.className='cell';
    const h = hues[i % hues.length];
    c.innerHTML = `<div class="g" style="background:
      radial-gradient(120% 100% at ${20+Math.random()*60}% ${20+Math.random()*60}%,
        hsl(${h} 70% 62% / .9), hsl(${(h+40)%360} 60% 38% / .95));"></div>`;
    grid.appendChild(c);
  }

  const scroller = document.getElementById('scroller');
  const hero = document.getElementById('hero');
  const heroBg = document.getElementById('heroBg');
  const heroTitle = document.getElementById('heroTitle');
  const navbar = document.getElementById('navbar');
  const navTitle = document.getElementById('navTitle');
  const BASE_H = 240;

  // ---- 上滚：标题收缩成导航栏大标题 ----
  function onScroll(){
    const t = Math.max(0, scroller.scrollTop);
    const prog = Math.min(t / 110, 1);            // 0->1
    // 大字标题上移+缩小+淡出
    heroTitle.style.transform = `translateY(${prog*46}px) scale(${1 - prog*0.22})`;
    heroTitle.style.opacity = String(1 - prog);
    // 导航栏标题淡入 + 毛玻璃
    navTitle.style.opacity = String(prog);
    navbar.classList.toggle('blurred', t > 20);
  }
  scroller.addEventListener('scroll', onScroll, {passive:true});

  // ---- 下拉：到顶后跟手拉伸 ----
  let dragging=false, startY=0, startScroll=0, pull=0;
  function applyPull(){
    hero.style.height = (BASE_H + pull) + 'px';
    // 背景图随拉伸向下平移并轻微放大，产生"跟手"感
    const s = 1 + pull/900;
    heroBg.style.transform = `scale(${s}) translateY(${pull*0.18}px)`;
  }
  scroller.addEventListener('pointerdown', e=>{
    dragging=true; startY=e.clientY; startScroll=scroller.scrollTop;
  });
  scroller.addEventListener('pointermove', e=>{
    if(!dragging) return;
    const dy = e.clientY - startY;
    if(startScroll<=0 && dy>0){ pull = Math.min(dy, 180); applyPull(); }
    else if(pull>0){ pull = Math.max(0, pull + dy*0.5); applyPull(); }
  });
  function endDrag(){
    if(!dragging) return; dragging=false;
    if(pull>0){
      hero.style.transition='height .45s cubic-bezier(.22,1,.36,1)';
      heroBg.style.transition='transform .45s cubic-bezier(.22,1,.36,1)';
      pull=0; applyPull();
      setTimeout(()=>{ hero.style.transition=''; heroBg.style.transition=''; },460);
    }
  }
  scroller.addEventListener('pointerup', endDrag);
  scroller.addEventListener('pointercancel', endDrag);
  scroller.addEventListener('pointerleave', endDrag);
  // 桌面鼠标滚轮到顶后也给一点拉伸
  scroller.addEventListener('wheel', e=>{
    if(scroller.scrollTop<=0 && e.deltaY>0 && pull<140){
      pull = Math.min(pull + e.deltaY*0.6, 140); applyPull();
      clearTimeout(window._rb);
      window._rb = setTimeout(()=>{
        hero.style.transition='height .45s cubic-bezier(.22,1,.36,1)';
        heroBg.style.transition='transform .45s cubic-bezier(.22,1,.36,1)';
        pull=0; applyPull();
        setTimeout(()=>{hero.style.transition='';heroBg.style.transition='';},460);
      },120);
    }
  }, {passive:true});
</script>
</body>
</html>
