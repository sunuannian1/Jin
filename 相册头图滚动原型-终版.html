<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>相册头图终版原型</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family:-apple-system,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;
    background:#0f1115; display:flex; align-items:center; justify-content:center;
    min-height:100vh; gap:32px; padding:24px;
  }
  .phone {
    width:390px; height:844px; background:#000; border-radius:54px;
    box-shadow:0 30px 80px rgba(0,0,0,.6), 0 0 0 12px #1c1c1e, 0 0 0 13px #3a3a3c;
    position:relative; overflow:hidden; flex-shrink:0;
  }
  .screen { position:absolute; inset:0; border-radius:54px; overflow:hidden; background:#f2f2f7; }
  .scroller { position:absolute; inset:0; overflow-y:auto; overscroll-behavior:none; -webkit-overflow-scrolling:touch; }
  .scroller::-webkit-scrollbar{ display:none; }

  .statusbar {
    position:absolute; top:0; left:0; right:0; height:54px; z-index:30;
    display:flex; justify-content:space-between; align-items:center;
    padding:18px 28px 0; color:#111; font-size:15px; font-weight:600; pointer-events:none;
  }
  .navbar {
    position:absolute; top:54px; left:0; right:0; height:44px; z-index:29;
    display:flex; align-items:center; justify-content:center; transition:background .25s;
  }
  .navbar .back { position:absolute; left:8px; top:0; height:44px; width:48px; display:flex; align-items:center; font-size:22px; color:#007aff; }
  .navbar .right { position:absolute; right:16px; top:0; height:44px; display:flex; align-items:center; font-size:16px; color:#007aff; }
  .navbar .nav-title { font-size:17px; font-weight:600; opacity:0; transition:opacity .25s; }
  .navbar.blurred { background:rgba(249,249,249,.86); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-bottom:.5px solid rgba(0,0,0,.08); }

  /* Large Title 区 */
  .lt-block { padding:4px 20px 14px; }
  .lt { font-size:32px; font-weight:800; color:#000; letter-spacing:-.5px; will-change:transform,opacity; }
  .lt-sub { font-size:14px; font-weight:500; color:#8e8e93; margin-top:3px; }

  /* 全宽出血封面：滚动流第一行，下拉拉伸 */
  .cover { position:relative; width:100%; height:220px; overflow:hidden; will-change:height; }
  .cover .bg {
    position:absolute; inset:0; will-change:transform;
    background:
      radial-gradient(90% 60% at 70% 15%, rgba(255,220,170,.55), transparent 60%),
      radial-gradient(70% 60% at 20% 85%, rgba(120,180,255,.45), transparent 65%),
      linear-gradient(165deg,#274b7a 0%,#3a76ab 48%,#e08a4a 100%);
  }
  .cover .deco {
    position:absolute; left:0; right:0; bottom:0; height:40%;
    background:linear-gradient(to top, rgba(0,0,0,.18), transparent);
  }

  .datehdr { display:flex; align-items:baseline; justify-content:space-between; padding:18px 20px 8px; }
  .datehdr .d { font-size:17px; font-weight:700; color:#000; }
  .datehdr .n { font-size:13px; font-weight:500; color:#8e8e93; }

  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:3px; padding:0 0 120px; }
  .cell { aspect-ratio:1/1; overflow:hidden; background:#e5e5ea; position:relative; }
  .cell .g { position:absolute; inset:0; }

  .notes { width:320px; color:#e8e8ec; }
  .notes h2 { font-size:20px; margin-bottom:6px; font-weight:700; }
  .notes p.sub { font-size:13px; color:#8e8e93; margin-bottom:16px; }
  .notes ul { list-style:none; }
  .notes li { font-size:14px; line-height:1.7; margin-bottom:10px; padding-left:18px; position:relative; color:#c7c7cc; }
  .notes li::before { content:""; position:absolute; left:0; top:9px; width:7px; height:7px; border-radius:50%; background:#34c759; }
  .notes b { color:#fff; }
  @media (max-width:920px){ .notes{ display:none; } }
</style>
</head>
<body>
  <div class="phone">
    <div class="screen">
      <div class="scroller" id="scroller">
        <div class="lt-block" id="ltBlock">
          <div class="lt" id="ltTitle">秋季运动会</div>
          <div class="lt-sub">28 张照片 · 9月16日</div>
        </div>
        <div class="cover" id="cover">
          <div class="bg" id="coverBg"></div>
          <div class="deco"></div>
        </div>

        <div class="datehdr">
          <span class="d">2025年9月16日 星期二</span>
          <span class="n">12 张</span>
        </div>
        <div class="grid" id="grid"></div>
      </div>

      <div class="statusbar"><span>9:41</span><span style="font-size:12px;">▂▄▆ ▮</span></div>
      <div class="navbar" id="navbar">
        <span class="back">‹</span>
        <span class="nav-title" id="navTitle">秋季运动会</span>
        <span class="right">选择</span>
      </div>
    </div>
  </div>

  <div class="notes">
    <h2>终版：Large Title + 全宽出血封面</h2>
    <p class="sub">Apple Music / TV / 相册"为你推荐"同款结构</p>
    <ul>
      <li><b>32pt 大标题</b>在左上、干净留白，封面<b>全宽出血不压字</b>，信息层级最清爽。</li>
      <li><b>上滑</b>：大标题收进毛玻璃导航栏，封面随内容走，不断开。</li>
      <li><b>下拉</b>：到顶跟手拉伸（带阻尼），松手弹性回弹。</li>
      <li>浅灰分组底、系统蓝、3 列贴边正方形，最耐看的原生感。</li>
    </ul>
  </div>

<script>
  const grid = document.getElementById('grid');
  const hues=[205,150,30,350,275,185,40,215,10,135,300,50,160,25,340,190,85,265];
  for(let i=0;i<18;i++){
    const c=document.createElement('div'); c.className='cell';
    const h=hues[i%hues.length];
    c.innerHTML=`<div class="g" style="position:absolute;inset:0;background:
      radial-gradient(120% 100% at ${20+Math.random()*60}% ${20+Math.random()*60}%,
        hsl(${h} 65% 62%/.95), hsl(${(h+40)%360} 60% 38%/.95));"></div>`;
    grid.appendChild(c);
  }

  const scroller=document.getElementById('scroller');
  const cover=document.getElementById('cover'), coverBg=document.getElementById('coverBg');
  const ltBlock=document.getElementById('ltBlock'), ltTitle=document.getElementById('ltTitle');
  const navbar=document.getElementById('navbar'), navTitle=document.getElementById('navTitle');
  const BASE_H=220;

  function onScroll(){
    const t=Math.max(0,scroller.scrollTop);
    const p=Math.min(t/100,1);
    ltTitle.style.transform=`translateY(${p*26}px) scale(${1-p*0.32})`;
    ltTitle.style.opacity=String(1-p);
    ltBlock.style.opacity=String(1-p*0.55);
    navTitle.style.opacity=String(p);
    navbar.classList.toggle('blurred', t>8);
  }
  scroller.addEventListener('scroll',onScroll,{passive:true});

  let dragging=false,startY=0,startScroll=0,pull=0;
  function applyPull(){
    cover.style.height=(BASE_H+pull)+'px';
    const s=1+pull/1100;
    coverBg.style.transform=`scale(${s}) translateY(${pull*0.16}px)`;
  }
  scroller.addEventListener('pointerdown',e=>{dragging=true;startY=e.clientY;startScroll=scroller.scrollTop;});
  scroller.addEventListener('pointermove',e=>{
    if(!dragging)return;
    const dy=e.clientY-startY;
    // 阻尼：下拉超过阈值后增量变小，更像原生橡皮筋
    let add=dy>0 ? dy*0.55 : dy*0.9;
    if(startScroll<=0 && dy>0){ pull=Math.min(Math.max(pull+add,0),170); applyPull(); }
    else if(pull>0){ pull=Math.max(0,pull+add); applyPull(); }
  });
  function endDrag(){
    if(!dragging)return; dragging=false;
    if(pull>0){
      cover.style.transition='height .5s cubic-bezier(.16,1,.3,1)';
      coverBg.style.transition='transform .5s cubic-bezier(.16,1,.3,1)';
      pull=0; applyPull();
      setTimeout(()=>{cover.style.transition='';coverBg.style.transition='';},510);
    }
  }
  scroller.addEventListener('pointerup',endDrag);
  scroller.addEventListener('pointercancel',endDrag);
  scroller.addEventListener('pointerleave',endDrag);
  scroller.addEventListener('wheel',e=>{
    if(scroller.scrollTop<=0 && e.deltaY>0 && pull<150){
      pull=Math.min(pull+e.deltaY*0.5,150); applyPull();
      clearTimeout(window._rb);
      window._rb=setTimeout(()=>{
        cover.style.transition='height .5s cubic-bezier(.16,1,.3,1)';
        coverBg.style.transition='transform .5s cubic-bezier(.16,1,.3,1)';
        pull=0; applyPull();
        setTimeout(()=>{cover.style.transition='';coverBg.style.transition='';},510);
      },120);
    }
  },{passive:true});
</script>
</body>
</html>
